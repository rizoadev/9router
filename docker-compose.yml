services:
  9router:
    build:
      context: .
    image: 9router-local:latest
    container_name: 9router-20129
    restart: always
    ports:
      - "20129:20128"
    volumes:
      - "/home/rizoa/.9router:/app/data"
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      INITIAL_PASSWORD: "change-me"
